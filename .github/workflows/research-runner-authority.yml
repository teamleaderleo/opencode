name: Research runner authority

on:
  push:
    branches:
      - research/runner-stale-idle-authority
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Run focused authority regression
        working-directory: packages/opencode
        run: bun test test/session/run-state-authority.test.ts --timeout 30000
