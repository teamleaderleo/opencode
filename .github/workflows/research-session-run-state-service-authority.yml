name: Research SessionRunState service authority

on:
  pull_request:
    branches:
      - research/base-f0afb
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  focused-test:
    if: github.event.pull_request.head.ref == 'research/session-run-state-service-authority'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Run direct SessionRunState authority regression
        working-directory: packages/opencode
        run: bun test test/session/run-state-service-authority.test.ts --timeout 30000
